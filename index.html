<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Analysis Data</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <nav>
        <h1>Health Analysis Census</h1>
        <ul>
            <li><a href="./index.html" id="home">Home</a></li>
            <li><a href="./health_contact.html">Contact Us</a></li>
            <li><input type="text" id="conditionInput" placeholde="Enter a health condition"></li>
            <li><button id="btnSearch">Search</button></li>
        </ul>
    </nav>

    <div class="container">
        <div class="analysisform">
            <h1>Healthcare Data Analysis</h1>
            <div>
                <label for="name">Name:</label>
                <input id="name" type="text" placeholder=" Enter your name">
            </div>
            <div>
                <label>Gender</label>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male" value="Male">
                
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female" value="Female">
            </div>
            <div>
                <label for="condition">Condition:</label>
                <select id="condition">
                    <option value="">Select condition</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Thyroid">Thyroid</option>
                    <option value="High Blood Pressure">High Blood Pressure</option>
                </select>
            </div>
            <button id="addPatient">Add Patient</button>
            <hr>
            <h2>Alaysis Report</h2>
            <div id="report"></div>
        </div>
        <div class="searchCondition">
            <div class="result"></div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
